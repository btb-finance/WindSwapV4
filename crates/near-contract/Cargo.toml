[package]
name = "windswap-near"
description = "Wind Swap v4 NEAR contract (v0 testnet demo) wrapping the windswap-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# near-sdk 5.27 needs rustc 1.86, newer than the workspace's 1.85 floor.
rust-version = "1.86"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Owner-only `test_credit` faucet. ON by default for the testnet demo.
# Build mainnet with `--no-default-features` so the faucet is not compiled in.
default = ["testnet-faucet"]
testnet-faucet = []

[dependencies]
near-sdk = { workspace = true }
windswap-engine = { path = "../engine", features = ["borsh"] }

[dev-dependencies]
# Host builds of near-sdk need `unit-testing`; it is only enabled for `cargo test`.
near-sdk = { workspace = true, features = ["unit-testing"] }
# Test-only oracles for the EVM transaction code: an independent EIP-1559 encoder, and a
# secp256k1 signer and recoverer. Neither is linked into the wasm.
alloy-consensus = { version = "0.9", features = ["k256"] }
alloy-eips = "0.9"
alloy-primitives = { workspace = true, features = ["std"] }
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
