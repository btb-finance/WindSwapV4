[workspace]
resolver = "3"
members = ["crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/btb-finance/WindSwapV4"

[workspace.dependencies]
alloy-primitives = { version = "0.8", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
