[workspace]
resolver = "3"
members = ["crates/engine", "crates/near-contract", "crates/test-token"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/btb-finance/WindSwapV4"

[workspace.dependencies]
alloy-primitives = { version = "0.8", default-features = false }
# Pinned: 5.28+ requires rustc 1.93 (the toolchain here is 1.89). 5.27.0 needs 1.86.
near-sdk = "=5.27.0"
near-contract-standards = "=5.27.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
